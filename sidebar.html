
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px 10px;
            color: #222;
            background: #fff;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 22px;
        }

        .acc-menu,
        .acc-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.5;
        }

        .acc-menu li {
            position: relative;
        }

        /* Parent and child links */
        .acc-menu a {
            display: block;
            padding: 8px 10px;
            color: #222;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .acc-menu a:hover {
            color: #d00;
            background: #f7f7f7;
        }

        /* Hide the checkbox but keep it functional */
        .acc-menu input[type="checkbox"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        /* Parent row label */
        .acc-menu > li > label {
            display: block;
            position: relative;
            padding: 8px 10px 8px 34px;
            font-weight: bold;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        .acc-menu > li > label:hover {
            color: #d00;
            background: #f7f7f7;
        }

        /* Plus/minus indicator */
        .acc-menu > li > label::before {
            content: "+";
            position: absolute;
            left: 10px;
            top: 8px;
            width: 16px;
            text-align: center;
            font-weight: bold;
        }

        .acc-menu > li > input:checked + label::before {
            content: "\2212";
        }

        /* Keyboard focus */
        .acc-menu input:focus-visible + label {
            outline: 2px solid #1677ff;
            outline-offset: 2px;
        }

        /* Collapse child lists */
        .acc-menu > li > ul {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        /* Expand children when checked */
        .acc-menu > li > input:checked ~ ul {
            max-height: 500px;
        }

        /* Indent child links */
        .acc-menu > li > ul > li > a {
            padding-left: 34px;
        }

        @media (prefers-reduced-motion: reduce) {
            .acc-menu > li > ul {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <h2>Menu</h2>

    <ul class="acc-menu">
        <li>
            <input type="checkbox" id="parent1">
            <label for="parent1">Parent Category 1</label>

            <ul>
                <li>
                    <a href="child1.html" target="mainFrame">
                        Child Category
                    </a>
                </li>
                <li>
                    <a href="middle1.html" target="mainFrame">
                        The Middle Child
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="parent2">
            <label for="parent2">Parent Category 2</label>

            <ul>
                <li>
                    <a href="child2.html" target="mainFrame">
                        Child Category
                    </a>
                </li>
                <li>
                    <a href="middle2.html" target="mainFrame">
                        The Middle Child
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="parent3">
            <label for="parent3">Parent Category 3</label>

            <ul>
                <li>
                    <a href="child3.html" target="mainFrame">
                        Child Category
                    </a>
                </li>
                <li>
                    <a href="middle3.html" target="mainFrame">
                        The Middle Child
                    </a>
                </li>
            </ul>
        </li>
    </ul>
</body>
</html>
