
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px 10px;
            color: #222;
            background: #fff;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 22px;
        }

        .menu,
        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.5;
        }

        .menu li {
            position: relative;
        }

        .menu li a {
            display: block;
            padding: 8px 10px;
            color: #222;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .menu li a:hover {
            color: #d00;
            background: #f7f7f7;
        }

        .menu > li > a {
            font-weight: bold;
        }

        .menu > li > ul > li a {
            padding-left: 30px;
        }
    </style>
</head>

<body>

</html>
