
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sidebar Menu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px 10px;
            color: #222;
            background: #fff;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 22px;
        }

        .acc-menu,
        .acc-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            line-height: 1.5;
        }

        .acc-menu li {
            position: relative;
        }

        .acc-menu li a {
            display: block;
            padding: 8px 10px;
            color: #222;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .acc-menu li a:hover {
            color: #d00;
            background: #f7f7f7;
        }

        .acc-menu > li > a {
            padding-left: 34px;
            font-weight: bold;
        }

        .acc-menu input[type="checkbox"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .acc-menu label {
            position: absolute;
            top: 4px;
            left: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 32px;
            font-weight: bold;
            cursor: pointer;
        }

        .acc-menu label::before {
            content: "+";
        }

        .acc-menu input:checked + label::before {
            content: "−";
        }

        .acc-menu input:focus-visible + label {
            outline: 2px solid #1677ff;
        }

        .acc-menu > li > ul {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
        }

        .acc-menu > li > ul > li {
            min-height: 0;
            overflow: hidden;
        }

        .acc-menu > li > ul > li a {
            padding-left: 34px;
        }

        .acc-menu input:checked ~ ul {
            grid-template-rows: 1fr;
        }

        @media (prefers-reduced-motion: reduce) {
            .acc-menu > li > ul {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <h2>Menu</h2>

    <ul class="acc-menu">
        <li>
            <input type="checkbox" id="acc-1">
            <label for="acc-1"
                   aria-label="Toggle first category"></label>

            <a href="category1.html" target="mainFrame">
                Parent Category 1
            </a>

            <ul>
                <li><a href="child1.html" target="mainFrame">Child Category</a></li>
                <li><a href="middle1.html" target="mainFrame">The Middle Child</a></li>
                <li><a href="golden1.html" target="mainFrame">The Golden Child</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="acc-2" checked>
            <label for="acc-2"
                   aria-label="Toggle second category"></label>

            <a href="category2.html" target="mainFrame">
                Parent Category 2
            </a>

            <ul>
                <li><a href="child2.html" target="mainFrame">Child Category</a></li>
                <li><a href="middle2.html" target="mainFrame">The Middle Child</a></li>
                <li><a href="golden2.html" target="mainFrame">The Golden Child</a></li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="acc-3">
            <label for="acc-3"
                   aria-label="Toggle third category"></label>

            <a href="category3.html" target="mainFrame">
                Parent Category 3
            </a>

            <ul>
                <li><a href="child3.html" target="mainFrame">Child Category</a></li>
                <li><a href="middle3.html" target="mainFrame">The Middle Child</a></li>
                <li><a href="golden3.html" target="mainFrame">The Golden Child</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
