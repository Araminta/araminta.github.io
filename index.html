
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Accordion Menu</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            color: #222;
            background: #fff;
        }

        .page-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            height: calc(100vh - 48px);
            margin: 0 auto;
        }

        /* Sidebar frame */
        .sidebar {
            flex: 0 0 220px;
            width: 220px;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .sidebar iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Main content frame */
        .main-content {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .main-content iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .page-layout {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 24px);
                gap: 12px;
            }

            .sidebar {
                flex: none;
                width: 100%;
                height: 280px;
            }

            .main-content {
                flex: 1;
                min-height: 400px;
            }

            .main-content iframe {
                min-height: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="page-layout">

        <!-- Sidebar loads its own HTML file -->
        <aside class="sidebar">
            <iframe
                src="sidebar.html"
                name="sidebarFrame"
                title="Navigation menu">
            </iframe>
        </aside>

        <!-- Sidebar links load pages inside this frame -->
        <main class="main-content">
            <iframe
                src="home.html"
                name="mainFrame"
                title="Main content"
                id="mainFrame">
            </iframe>
        </main>

    </div>
</body>
</html>
